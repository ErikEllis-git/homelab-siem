# Install: sudo mkdir -p /etc/systemd/system/docker.service.d
#          sudo cp 10-after-tailscale.conf /etc/systemd/system/docker.service.d/
#          sudo systemctl daemon-reload   (takes effect on next docker restart/boot)
#
# Why: ES publishes 9200 on the Tailscale IP (P0-1). If dockerd starts before
# tailscale0 has its address, the bind fails ("cannot assign requested
# address"), the elasticsearch container dies, and Docker's restart policy does
# not retry a failed network setup. See INCIDENTS.md, Incident 002.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $$(seq 1 60); do ip -4 addr show tailscale0 2>/dev/null | grep -q "inet 100\\." && exit 0; sleep 1; done; echo "tailscale0 IP not ready after 60s, starting docker anyway" >&2; exit 0'
